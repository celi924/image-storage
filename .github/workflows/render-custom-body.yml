name: Render custom Genesis 2 body inspection

on:
  push:
    paths:
      - ".github/workflows/render-custom-body.yml"
      - "build_plain_pantyhose_shell.py"
      - "build_mask_extract_prototype.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri libxkbcommon0
      - name: Test Blender Mask Extract API
        run: |
          blender -b -noaudio --python-exit-code 1 --python test_mask_extract_api.py
      - name: Build full-body Mask Extract prototype\n        run: |\n          blender -b -noaudio --python-exit-code 1 --python build_mask_extract_prototype.py\n          cat candidate_mask_extract/report.json\n      - name: Render orthographic inspection views
        run: |
          blender -b -noaudio --python-exit-code 1 --python build_plain_pantyhose_shell.py
          echo "===== TOPOLOGY REPORT ====="
          cat candidate/build_report.txt
      - name: Upload inspection renders
        uses: actions/upload-artifact@v4
        with:
          name: custom-body-inspection-views
          path: |\n            candidate/\n            candidate_mask_extract/
          retention-days: 7

