name: Export image files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package reference files
        run: |
          mkdir -p export
          cp 21_pantyhose_tr.jpg 23_pantyhose_tr.jpg ScreenShot_2026-11-26_193534_725.png ScreenShot_2026-11-26_193601_620.png ScreenShot_2026-11-26_211016_216.7z export/
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: image-storage-reference-files
          path: export/
          if-no-files-found: error
          retention-days: 1
