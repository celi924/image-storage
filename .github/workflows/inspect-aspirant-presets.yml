name: Inspect Aspirant preset parameters
on:
  push:
    paths:
      - ".github/workflows/inspect-aspirant-presets.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump relevant preset controls and wrap records
        run: |
          curl -fLsS "https://github.com/celi924/image-storage/releases/download/reference-v1/Aspirant.Pantyhose.1.zip" -o source.zip
          python - <<'PY'
          import zipfile,json
          z=zipfile.ZipFile('source.zip')
          for n in z.namelist():
              if n.endswith('.vap') and ('Open Buttocks' in n or 'Open Front and Back' in n or 'Default' in n):
                  d=json.loads(z.read(n).decode('utf-8-sig'))
                  print('PRESET',n)
                  for s in d.get('storables',[]):
                      print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          for n in z.namelist():
              if n.endswith('Pantyhose.vaj'):
                  d=json.loads(z.read(n).decode('utf-8-sig'))
                  print('VAJ_COMPONENTS')
                  for c in d.get('components',[]): print(json.dumps(c,ensure_ascii=False)[:5000])
                  print('VAJ_STORABLES')
                  for s in d.get('storables',[]): print(json.dumps(s,ensure_ascii=False)[:5000])
          PY