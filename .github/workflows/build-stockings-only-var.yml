name: Build basic plain-color stockings VaM package

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-stockings-only-var.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download original full-geometry reference package
        run: |
          set -euo pipefail
          curl -fL "https://github.com/celi924/image-storage/releases/download/reference-v1/Aspirant.Pantyhose.1.zip" -o source.zip
          unzip -q source.zip -d source
      - name: Build full-coverage plain-color baseline without deleting mesh
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, zipfile, hashlib
          root=pathlib.Path("source/Custom/Clothing/Female/Aspirant/Pantyhose")
          vam_path=root/"Pantyhose.vam"
          vaj_path=root/"Pantyhose.vaj"
          vab_path=root/"Pantyhose.vab"
          original_vab=vab_path.read_bytes()
          vam=json.loads(vam_path.read_text(encoding="utf-8-sig"))
          vaj=json.loads(vaj_path.read_text(encoding="utf-8-sig"))
          assert vam.get("itemType")=="ClothingFemale", vam.get("itemType")
          assert len(original_vab)>100000
          assert any(c.get("type")=="DAZMesh" for c in vaj.get("components",[]))
          # The base preset already uses a single diffuse color and no diffuse/pattern texture.
          preset_path=root/"Pantyhose_Default.vap"
          preset=json.loads(preset_path.read_text(encoding="utf-8-sig"))
          material=next(s for s in preset["storables"] if s.get("id")=="PantyhoseMaterialCombined")
          assert material.get("customTexture_MainTex","")=="" 
          assert material.get("customTexture_DecalTex","")==""
          assert material.get("customTexture_BumpMap","")==""
          alpha=material.get("customTexture_AlphaTex","")
          assert alpha.endswith("3_pantyhose_tr.jpg"), alpha
          # Preserve the complete original mesh, SkinWrap, UVs, and all vertex groups byte-for-byte.
          assert vab_path.read_bytes()==original_vab
          # Give the basic plain-color preset a clear name while keeping the original base color and alpha coverage.
          preset_path.rename(root/"Pantyhose_Basic_Plain.vap")
          meta_path=pathlib.Path("source/meta.json")
          meta=json.loads(meta_path.read_text(encoding="utf-8-sig"))
          meta["packageName"]="StockingsBasic"
          # Keep original creator/license fields and the full original content; do not publish altered geometry.
          meta_path.write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")
          with zipfile.ZipFile("Aspirant.StockingsBasic.1.var","w",zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in pathlib.Path("source").rglob("*"):
                  if p.is_file(): z.write(p,p.relative_to("source").as_posix())
          with zipfile.ZipFile("Aspirant.StockingsBasic.1.var") as z:
              assert "meta.json" in z.namelist()
              assert "Custom/Clothing/Female/Aspirant/Pantyhose/Pantyhose.vab" in z.namelist()
              assert "Custom/Clothing/Female/Aspirant/Pantyhose/Pantyhose_Basic_Plain.vap" in z.namelist()
              assert z.testzip() is None
          print("FULL_ORIGINAL_VAB_PRESERVED",len(original_vab),hashlib.sha256(original_vab).hexdigest())
          print("BASIC_PRESET_ALPHA_MASK",alpha)
          print("DIFFUSE_COLOR",json.dumps(material.get("Diffuse Color"),sort_keys=True))
          print("NO_DIFFUSE_PATTERN_TEXTURE",True)
          print("VAR_BYTES",pathlib.Path("Aspirant.StockingsBasic.1.var").stat().st_size)
          print("VAR_SHA256",hashlib.sha256(pathlib.Path("Aspirant.StockingsBasic.1.var").read_bytes()).hexdigest())
          PY
      - name: Upload basic baseline package
        uses: actions/upload-artifact@v4
        with:
          name: Aspirant-StockingsBasic-VaM-var
          path: Aspirant.StockingsBasic.1.var
          retention-days: 7
