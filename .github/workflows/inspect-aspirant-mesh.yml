name: Inspect VaM pantyhose mesh assets

on:
  push:
    paths:
      - ".github/workflows/inspect-aspirant-mesh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-mesh:
    runs-on: ubuntu-latest
    steps:
      - name: Install diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y file xxd binutils p7zip-full
      - name: Download source archive
        run: |
          curl -fL "https://github.com/celi924/image-storage/releases/download/reference-v1/Aspirant.Pantyhose.1.zip" -o source.zip
          unzip -q source.zip -d source
      - name: Identify VaM asset container and metadata
        run: |
          echo "=== FILE INVENTORY ==="
          find source -type f -printf '%p %s bytes\n' | sort
          echo "=== VAB FORMAT ==="
          VAB="$(find source -type f -iname 'Pantyhose.vab' | head -1)"
          if [ -n "$VAB" ]; then
            file "$VAB"
            stat "$VAB"
            echo "--- first 256 bytes ---"
            xxd -l 256 "$VAB"
            echo "--- printable strings ---"
            strings -a -n 5 "$VAB" | head -160
            echo "--- archive probe ---"
            7z l "$VAB" || true
          fi
          echo "=== VAM / VAJ / META TEXT ==="
          find source -type f \( -iname '*.vam' -o -iname '*.vaj' -o -iname 'meta.json' \) -print -exec sh -c 'echo "--- $1"; file "$1"; head -c 12000 "$1"; echo' _ {} \;
      - name: Probe UnityPy loading and object counts
        run: |
          python -m pip install --quiet UnityPy
          cat > mesh_probe.py <<'PY'
          import os, UnityPy, traceback
          candidates=[]
          for root, dirs, files in os.walk("source"):
              for name in files:
                  if name.lower().endswith((".vab",".assets",".assetbundle",".bundle")):
                      candidates.append(os.path.join(root,name))
          for path in candidates:
              print("\\n=== UNITYPY:",path,"===")
              try:
                  env=UnityPy.load(path)
                  print("OBJECT_COUNT",len(env.objects))
                  counts={}
                  for obj in env.objects:
                      typ=obj.type.name
                      counts[typ]=counts.get(typ,0)+1
                      if typ in ("Mesh","SkinnedMeshRenderer","MeshRenderer","MeshFilter","Material","Texture2D"):
                          try:
                              d=obj.read()
                              print("OBJECT",typ,"name=",getattr(d,"m_Name",""),"path_id=",obj.path_id)
                          except Exception as e: print("READ_ERROR",typ,repr(e))
                  print("TYPE_COUNTS",counts)
              except Exception as e:
                  print("LOAD_ERROR",repr(e))
                  traceback.print_exc(limit=2)
          PY
          python mesh_probe.py | tee mesh-report.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: aspirant-vab-format-diagnostics
          path: mesh-report.txt
          retention-days: 1
