name: Inspect VaM pantyhose mesh assets

on:
  push:
    paths:
      - ".github/workflows/inspect-aspirant-mesh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-mesh:
    runs-on: ubuntu-latest
    steps:
      - name: Download source archive
        run: |
          curl -fL "https://github.com/celi924/image-storage/releases/download/reference-v1/Aspirant.Pantyhose.1.zip" -o source.zip
          unzip -q source.zip -d source
      - name: Inspect Unity asset bundle meshes
        run: |
          python -m pip install --quiet UnityPy
          cat > inspect.py <<'PY'
          import os, json, UnityPy
          for root, dirs, files in os.walk("source"):
              for name in files:
                  path=os.path.join(root,name)
                  try:
                      env=UnityPy.load(path)
                  except Exception:
                      continue
                  print("\\n=== ASSET FILE:", path, "===")
                  for obj in env.objects:
                      try:
                          data=obj.read()
                          typ=obj.type.name
                          if typ == "Mesh":
                              print("MESH", json.dumps({
                                  "name": getattr(data,"m_Name",""),
                                  "vertices": len(getattr(data,"m_Vertices",[]) or []),
                                  "submeshes": len(getattr(data,"m_SubMeshes",[]) or []),
                                  "indexFormat": str(getattr(data,"m_IndexFormat","")),
                                  "bounds": str(getattr(data,"m_LocalAABB",""))
                              }, default=str))
                          elif typ in ("SkinnedMeshRenderer","MeshRenderer","MeshFilter","Material","Texture2D"):
                              print(typ, json.dumps({"name":getattr(data,"m_Name",""),"mesh":str(getattr(data,"m_Mesh","")),"materials":str(getattr(data,"m_Materials",""))[:500]},default=str))
                      except Exception as e:
                          print("OBJECT_ERROR",obj.type.name,str(e)[:200])
          PY
          python inspect.py | tee mesh-report.txt
      - name: Upload mesh inspection report
        uses: actions/upload-artifact@v4
        with:
          name: aspirant-mesh-inspection
          path: mesh-report.txt
          retention-days: 1
