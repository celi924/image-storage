name: Inspect pantyhose material regions and topology
on:
  push:
    paths:
      - ".github/workflows/inspect-uv-regions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL "https://github.com/celi924/image-storage/releases/download/reference-v1/Aspirant.Pantyhose.1.zip" -o source.zip
          unzip -q source.zip -d source
          curl -fL "https://raw.githubusercontent.com/iiishop/Vam2UE5/df0c9b95c25b36dc709f7653950d1487eb26978c/Scripts/vam_decode.py" -o vam_decode.py
          python -m pip install numpy
          cat > inspect_regions.py <<'PY'
          import json,pathlib,sys,collections
          sys.path.insert(0,'.')
          import vam_decode
          root=pathlib.Path('source/Custom/Clothing/Female/Aspirant/Pantyhose')
          vam=json.loads((root/'Pantyhose.vam').read_text())
          vaj=json.loads((root/'Pantyhose.vaj').read_text())
          mesh=vam_decode.decode_vab((root/'Pantyhose.vab').read_bytes(),vam,vaj)['meshes'][0]
          verts=mesh['vertices']; faces=mesh['polygons']; mats=mesh['materials']
          def bounds(ids):
              pts=[verts[i] for i in ids]
              return [[round(min(p[a] for p in pts),5),round(max(p[a] for p in pts),5)] for a in range(3)] if pts else None
          report=[]
          print('VERTICES',len(verts),'FACES',len(faces),'MATERIALS',mats)
          for mi,name in enumerate(mats):
              fs=[(fi,f['vertices']) for fi,f in enumerate(faces) if f['materialNum']==mi]
              ids=sorted({v for _,f in fs for v in f})
              ys=[verts[i][1] for i in ids]
              bins=collections.Counter(min(11,max(0,int((y+0.005)/1.205*12))) for y in ys)
              print('MATERIAL',mi,name,'faces',len(fs),'vertices',len(ids),'xyz_bounds',bounds(ids),'y_bins',dict(sorted(bins.items())))
              # Face connected components, based on shared mesh vertices
              v2f=collections.defaultdict(list)
              for local,(_,f) in enumerate(fs):
                  for v in f: v2f[v].append(local)
              unseen=set(range(len(fs))); comps=[]
              while unseen:
                  seed=unseen.pop(); stack=[seed]; comp=[seed]
                  while stack:
                      cur=stack.pop()
                      for v in fs[cur][1]:
                          for nb in v2f[v]:
                              if nb in unseen:
                                  unseen.remove(nb); stack.append(nb); comp.append(nb)
                  comps.append(comp)
              comps.sort(key=len,reverse=True)
              print('  COMPONENTS',[(len(c),bounds(sorted({v for j in c for v in fs[j][1]}))) for c in comps[:12]])
              report.append((mi,name,fs))
          # Export one OBJ with distinct object groups by material for independent inspection.
          with open('material-regions.obj','w') as out:
              for v in verts: out.write('v %.7f %.7f %.7f\\n'%tuple(v))
              for uv in mesh['uv']: out.write('vt %.7f %.7f\\n'%tuple(uv))
              for mi,name,fs in report:
                  out.write('g '+''.join(c if c.isalnum() else '_' for c in name)+'\\n')
                  for _,face in fs:
                      # UV polygon indices use the same indexing scheme in this mesh.
                      out.write('f '+' '.join(str(i+1) for i in face)+'\\n')
          PY
          python inspect_regions.py | tee material-region-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pantyhose-material-region-analysis
          path: |
            material-region-report.txt
            material-regions.obj
          retention-days: 7
